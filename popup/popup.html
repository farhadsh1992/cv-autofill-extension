<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Farhad's CV AutoFill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Farhad's CV AutoFill</h1>
      <button id="openOptions" class="linklike" title="Options">⚙</button>
    </header>

    <div id="loadedSummary" class="summary"></div>

    <section id="fillSection">
      <button id="autofillBtn" disabled>Autofill this page</button>
      <p class="muted small">Only fills fields — never clicks Submit. Always review before sending.</p>
    </section>

    <section id="coverLetterSection">
      <button id="generateBtn" disabled>Generate cover letter for this page</button>
      <div id="coverLetterResult" class="hidden">
        <textarea id="coverLetterOutput" rows="10"></textarea>
        <div class="row">
          <button id="copyBtn" class="secondary">Copy</button>
          <button id="downloadPdfBtn" class="secondary">Download PDF</button>
          <button id="insertBtn" class="secondary hidden">Insert into page field</button>
        </div>
      </div>
    </section>

    <section id="cvDocxSection">
      <button id="generateCvDocxBtn" disabled>Generate tailored CV (Word)</button>
      <p class="muted small">Re-emphasizes your real CV content for this job — downloads as a .docx.</p>
    </section>

    <section id="extrasSection">
      <div class="row">
        <button id="addInfoBtn" class="secondary">Add info</button>
        <button id="askBtn" class="secondary">Ask AI directly</button>
      </div>
      <p class="muted small">Ask AI directly is for questions autofill couldn't confidently answer.</p>
    </section>

    <div id="status" class="status"></div>

    <script src="../shared/theme.js"></script>
    <script src="../shared/blocklist.js"></script>
    <script src="../shared/copy-status.js"></script>
    <script src="../lib/pdf-writer.js"></script>
    <script src="../lib/docx-writer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
