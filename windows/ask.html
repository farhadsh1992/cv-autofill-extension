<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ask AI</title>
    <link rel="stylesheet" href="windows.css" />
  </head>
  <body>
    <h1>Ask AI directly</h1>
    <p class="muted">For when autofill couldn't confidently answer something. Uses your saved CV and resources as context.</p>

    <textarea id="question" rows="3" placeholder="e.g. How should I answer &quot;expected salary&quot;?" autofocus></textarea>

    <div class="row">
      <button id="ask">Ask</button>
    </div>

    <div id="answerBox" class="answerBox hidden"></div>
    <div class="row">
      <button id="copyBtn" class="secondary hidden">Copy answer</button>
    </div>

    <div id="status" class="status"></div>

    <script src="ask.js"></script>
  </body>
</html>
