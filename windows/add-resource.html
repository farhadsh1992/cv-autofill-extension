<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add info</title>
    <link rel="stylesheet" href="windows.css" />
  </head>
  <body>
    <h1>Add info</h1>
    <p class="muted">Saved as a resource — the AI will use it when filling forms, writing cover letters, and answering questions.</p>

    <input type="text" id="label" placeholder="Label (optional) — e.g. Salary expectations" />
    <textarea id="content" rows="8" placeholder="Whatever's useful to add" autofocus></textarea>

    <div class="row">
      <button id="save">Save</button>
      <button id="cancel" class="secondary">Cancel</button>
    </div>
    <div id="status" class="status"></div>

    <script src="../shared/theme.js"></script>
    <script src="../shared/copy-status.js"></script>
    <script src="add-resource.js"></script>
  </body>
</html>
